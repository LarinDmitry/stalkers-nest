name: Keepalive Render Backend

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request to Render
        run: |
          curl -s -f ${{ secrets.RENDER_HEALTH_URL }} || echo "Server cold start or error"
