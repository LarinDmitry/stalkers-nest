name: Keepalive Render Backend

on:
  schedule:
    # Run every 10 minutes (POSIX cron format)
    - cron: '*/10 * * * *'
  # Allows you to start a worker manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request to Render
        run: |
          curl -s -f https://stalkers-nest.onrender.com/health || echo "Server cold start or error"
